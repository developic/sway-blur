[package]
name = "sway-blur"
version = "1.3.1"
edition = "2021"
description = "Blur overlay for Sway"
license = "MIT"

[[bin]]
name = "sway-blur"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
fs2 = "0.4"
gtk = { version = "0.18", features = ["v3_24"] }
gdk = "0.18"
gdk-pixbuf = "0.18"
glib = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
image = { version = "0.25", default-features = false }
fast_image_resize = { version = "5", features = ["image"] }
memmap2 = "0.9"
async-channel = "2"
rustix = { version = "1", features = ["event"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
