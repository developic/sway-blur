name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Get version
        id: get_version
        run: |
          VERSION=$(awk -F'"' '/^\[package\]/{p=1} p && /^version *= *"/{print $2; exit}' Cargo.toml)
          test -n "$VERSION"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            pkg-config

          pkg-config --modversion glib-2.0
          pkg-config --modversion gtk+-3.0
          pkg-config --modversion gtk-layer-shell-0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --locked --target=${{ matrix.target }}

      - name: Package (*nix)
        env:
          VERSION: ${{ steps.get_version.outputs.value }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p pkg
          cp "target/${TARGET}/release/sway-blur" pkg/
          cp README.md LICENSE config.example.toml pkg/
          TARBALL="sway-blur-${VERSION}-linux-${ARCH}.tar.xz"
          tar -cJf "${TARBALL}" -C pkg sway-blur README.md LICENSE config.example.toml

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: "*.tar.xz"
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: release
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Get version
        id: get_version
        run: |
          VERSION=$(awk -F'"' '/^\[package\]/{p=1} p && /^version *= *"/{print $2; exit}' Cargo.toml)
          test -n "$VERSION"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: "*-unknown-linux-gnu"
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*.tar.xz
          name: v${{ steps.get_version.outputs.value }}
          tag_name: v${{ steps.get_version.outputs.value }}
